plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// modrinth maven
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	// cloth config
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }

	// Satin API
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
		content {
			includeGroup 'io.github.ladysnake'
			includeGroup 'org.ladysnake'
			includeGroupByRegex 'dev\\.onyxstudios.*'
		}
	}

	// Statement Mod API (BlockState properties for vanilla)
	maven {
		url = "https://jitpack.io"
	}

	// LambDynamicLights API
	repositories {
		maven {
			name = "Gegy"
			url = uri("https://maven.gegy.dev")
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// cloth config lib
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Revive mod
	modImplementation "maven.modrinth:revive:${project.revive_modrinth_version}"

	// Dehydration mod
	modImplementation "maven.modrinth:dehydration:${project.dehydration_modrinth_version}"

	// RPGZ mod
	modImplementation "maven.modrinth:rpgz:${project.rpgz_modrinth_version}"

	// Satin API
	modImplementation "org.ladysnake:satin:${project.satin_version}"

	// CCA
	modApi "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modApi "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	modApi "dev.onyxstudios.cardinal-components-api:cardinal-components-scoreboard:${project.cca_version}"
	modApi "dev.onyxstudios.cardinal-components-api:cardinal-components-chunk:${project.cca_version}"
	modApi "dev.onyxstudios.cardinal-components-api:cardinal-components-block:${project.cca_version}"

	// Statement
	modApi("com.github.Virtuoel:Statement:${project.statement_version}", {
		exclude group: "net.fabricmc.fabric-api"
	})

	// Iris
	modCompileOnly "maven.modrinth:iris:${project.iris_version}"
	modImplementation "maven.modrinth:iris:${project.iris_version}" // For testing in dev
	modImplementation "maven.modrinth:sodium:${project.sodium_version}"	// For testing only, not a compat

	// stupid Iris stuff istg make your own mavens finally ffs
	modImplementation("org.antlr:antlr4-runtime:4.13.1")
	modImplementation("org.antlr:antlr4-runtime:4.13.1")
	modImplementation("io.github.douira:glsl-transformer:2.0.1")
	modImplementation("io.github.douira:glsl-transformer:2.0.1")
	modImplementation("org.anarres:jcpp:1.4.14")
	modImplementation("org.anarres:jcpp:1.4.14")


	// LambDynamicLights API
	modCompileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynamiclights_version}")
	modRuntimeOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:${project.lambdynamiclights_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {

	}
}

// to avoid "duplicate fabric loader classes found on classpath: ..."
configurations.configureEach {
	resolutionStrategy {
		force("net.fabricmc:fabric-loader:$loader_version")
	}
}

loom {
	accessWidenerPath = file("src/main/resources/nemuelch.accesswidener")
}